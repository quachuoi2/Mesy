# Add this target to a data repository's sync.conf.
# Run setup.py --codex preview before adopting existing files.
[target:codex]
type = codex
repo_subdir = codex
sync_mode = symlink
export_memories = false
export_settle_seconds = 2

# Resolve source from CODEX_HOME, otherwise ~/.codex.
# source = ~/.codex

# Select only personal skills you intend to share, including their assets.
# skills = my-personal-skill
# skills_source = ~/.agents/skills
